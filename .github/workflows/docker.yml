name: Build and Push Docker Images

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wunschliste-app:latest
            ghcr.io/${{ github.repository_owner }}/wunschliste-app:${{ github.sha }}

      - name: Build and push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wunschliste-migrate:latest
            ghcr.io/${{ github.repository_owner }}/wunschliste-migrate:${{ github.sha }}